name: CI

# Chạy y nguyên cổng gác ở AGENTS.md mục 7. Sửa bước "Cổng gác" nếu repo dùng profile khác (make check, pnpm -r check...).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cổng gác
        run: |
          if [ ! -f package.json ]; then
            echo "::warning::Chưa có package.json (repo mới/chỉ có docs). Điền cổng gác thật ở AGENTS.md mục 7 và sửa bước này khi slice-0 tạo bộ khung."
            exit 0
          fi
          npm ci
          npm run lint && npm run typecheck && npm test
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
